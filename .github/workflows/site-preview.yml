name: Site preview

on:
  workflow_call:
    inputs:
      preview-bucket:
        type: string
        required: true
      cms-domain:
        description: "cms-hostingモジュールのドメイン。指定すると https://<cms-domain>/preview/pr-<番号>/ に配信する（サイトのテンプレートがbase対応であること）"
        type: string
        default: ""
      preview-domain:
        description: "ホスト名形式のプレビューのドメイン。https://pr-<番号>.<preview-domain>/ に配信する（cms-domainが空のとき）"
        type: string
        default: ""
      aws-region:
        type: string
        default: ap-northeast-1
      role-arn:
        type: string
        required: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  deploy:
    if: github.event.action != 'closed' && inputs.role-arn != ''
    runs-on: ubuntu-latest
    steps:
      - name: Resolve preview location
        id: loc
        env:
          CMS_DOMAIN: ${{ inputs.cms-domain }}
          PREVIEW_DOMAIN: ${{ inputs.preview-domain }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$CMS_DOMAIN" ]; then
            echo "prefix=preview/pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "base_path=/preview/pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "site_url=https://${CMS_DOMAIN}" >> "$GITHUB_OUTPUT"
            echo "url=https://${CMS_DOMAIN}/preview/pr-${PR_NUMBER}/" >> "$GITHUB_OUTPUT"
          elif [ -n "$PREVIEW_DOMAIN" ]; then
            echo "prefix=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "base_path=" >> "$GITHUB_OUTPUT"
            echo "site_url=https://pr-${PR_NUMBER}.${PREVIEW_DOMAIN}" >> "$GITHUB_OUTPUT"
            echo "url=https://pr-${PR_NUMBER}.${PREVIEW_DOMAIN}/" >> "$GITHUB_OUTPUT"
          else
            echo "cms-domain か preview-domain のどちらかを指定してください" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PREVIEW: "1"
          SITE_URL: ${{ steps.loc.outputs.site_url }}
          BASE_PATH: ${{ steps.loc.outputs.base_path }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-arn }}
          aws-region: ${{ inputs.aws-region }}
      - run: aws s3 sync dist "s3://${{ inputs.preview-bucket }}/${{ steps.loc.outputs.prefix }}/" --delete
      - run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "プレビュー: ${URL} （最新コミット: ${SHA::7}、閲覧にはBasic認証が必要です）"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.loc.outputs.url }}

  cleanup:
    if: github.event.action == 'closed' && inputs.role-arn != ''
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role-arn }}
          aws-region: ${{ inputs.aws-region }}
      - name: Delete preview
        env:
          CMS_DOMAIN: ${{ inputs.cms-domain }}
          BUCKET: ${{ inputs.preview-bucket }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$CMS_DOMAIN" ]; then
            prefix="preview/pr-${PR_NUMBER}"
          else
            prefix="pr-${PR_NUMBER}"
          fi
          aws s3 rm "s3://${BUCKET}/${prefix}/" --recursive
