name: Site preview

on:
  workflow_call:
    inputs:
      config-file:
        description: "配信先の情報を書いたenvファイル（KEY=value）。キーの一覧はREADMEの「配信基盤の契約」を参照"
        type: string
        default: config/deploy.env
      preview-bucket:
        description: "envファイルの S3_BUCKET より優先するバケット名"
        type: string
        default: ""
      cms-domain:
        description: "envファイルの CMS_DOMAIN より優先するドメイン。https://<cms-domain>/preview/pr-<番号>/ に配信する（サイトのテンプレートがbase対応であること）"
        type: string
        default: ""
      preview-prefix:
        description: "envファイルの CMS_PREFIX より優先するプレフィックス（既定 cms）。プレビューは <prefix>/preview/pr-<番号>/ に置く"
        type: string
        default: ""
      aws-region:
        type: string
        default: ""
      role-arn:
        description: "envファイルの CMS_PREVIEW_ROLE_ARN より優先するロール。空でenvファイルにもなければ何もしない"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      bucket: ${{ steps.c.outputs.bucket }}
      domain: ${{ steps.c.outputs.domain }}
      prefix: ${{ steps.c.outputs.prefix }}
      region: ${{ steps.c.outputs.region }}
      role_arn: ${{ steps.c.outputs.role_arn }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: c
        env:
          CONFIG_FILE: ${{ inputs.config-file }}
          IN_BUCKET: ${{ inputs.preview-bucket }}
          IN_DOMAIN: ${{ inputs.cms-domain }}
          IN_PREFIX: ${{ inputs.preview-prefix }}
          IN_REGION: ${{ inputs.aws-region }}
          IN_ROLE_ARN: ${{ inputs.role-arn }}
        run: |
          json='{}'
          if [ -f "$CONFIG_FILE" ]; then
            json=$(jq -Rn '[inputs | select(test("^[A-Z0-9_]+=")) | capture("^(?<k>[A-Z0-9_]+)=(?<v>.*)$") | {key: .k, value: .v}] | from_entries' "$CONFIG_FILE")
          fi
          get() { jq -r --arg k "$1" '.[$k] // empty' <<<"$json"; }
          prefix="${IN_PREFIX:-$(get CMS_PREFIX)}"
          region="${IN_REGION:-$(get AWS_REGION)}"
          {
            echo "bucket=${IN_BUCKET:-$(get S3_BUCKET)}"
            echo "domain=${IN_DOMAIN:-$(get CMS_DOMAIN)}"
            echo "prefix=${prefix:-cms}"
            echo "region=${region:-ap-northeast-1}"
            echo "role_arn=${IN_ROLE_ARN:-$(get CMS_PREVIEW_ROLE_ARN)}"
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: config
    if: github.event.action != 'closed' && needs.config.outputs.role_arn != ''
    runs-on: ubuntu-latest
    steps:
      - name: Resolve preview location
        id: loc
        env:
          CMS_DOMAIN: ${{ needs.config.outputs.domain }}
          PREFIX: ${{ needs.config.outputs.prefix }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "prefix=${PREFIX}/preview/pr-${PR_NUMBER}"
            echo "base_path=/preview/pr-${PR_NUMBER}"
            echo "site_url=https://${CMS_DOMAIN}"
            echo "url=https://${CMS_DOMAIN}/preview/pr-${PR_NUMBER}/"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PREVIEW: "1"
          SITE_URL: ${{ steps.loc.outputs.site_url }}
          BASE_PATH: ${{ steps.loc.outputs.base_path }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ needs.config.outputs.role_arn }}
          aws-region: ${{ needs.config.outputs.region }}
      - env:
          BUCKET: ${{ needs.config.outputs.bucket }}
          PREFIX: ${{ steps.loc.outputs.prefix }}
        run: aws s3 sync dist "s3://${BUCKET}/${PREFIX}/" --delete --cache-control "no-cache"
      - run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "プレビュー: ${URL} （最新コミット: ${SHA::7}、閲覧にはBasic認証が必要です）"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.loc.outputs.url }}

  cleanup:
    needs: config
    if: github.event.action == 'closed' && needs.config.outputs.role_arn != ''
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ needs.config.outputs.role_arn }}
          aws-region: ${{ needs.config.outputs.region }}
      - name: Delete preview
        env:
          PREFIX: ${{ needs.config.outputs.prefix }}
          BUCKET: ${{ needs.config.outputs.bucket }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: aws s3 rm "s3://${BUCKET}/${PREFIX}/preview/pr-${PR_NUMBER}/" --recursive
