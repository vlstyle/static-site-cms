name: Site CI

on:
  workflow_call:
    inputs:
      path-guard:
        type: boolean
        default: true
    secrets:
      team-read-token:
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:admin
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: base
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        id: base-build
        continue-on-error: true
        working-directory: base
        run: |
          npm ci
          npm run build
      - if: github.event_name == 'pull_request' && steps.base-build.outcome == 'success'
        continue-on-error: true
        run: npx cms-dist-diff base/dist dist dist-diff
      - if: github.event_name == 'pull_request' && steps.base-build.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-diff
          path: |
            dist-diff/report.md
            dist-diff/dist.patch
          if-no-files-found: ignore
      - if: github.event_name == 'pull_request' && steps.base-build.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = 'dist-diff/report.md';
            if (!fs.existsSync(path)) return;
            const marker = '<!-- dist-diff -->';
            let report = fs.readFileSync(path, 'utf8');
            if (report.length > 60000) report = report.slice(0, 60000) + '\n... (truncated)';
            const body = [marker, report, '', `*全差分は artifact \`dist-diff\`（run: ${context.runId}）*`].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  path-guard:
    name: path-guard
    if: inputs.path-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: role
        env:
          GH_TOKEN: ${{ secrets.team-read-token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          role=operator
          for team in site-poweruser site-admins; do
            if gh api "orgs/${GITHUB_REPOSITORY_OWNER}/teams/${team}/memberships/${AUTHOR}" --silent 2>/dev/null; then
              role=privileged
            fi
          done
          echo "role=${role}" >> "$GITHUB_OUTPUT"
      - run: npx cms-path-guard
        env:
          AUTHOR_ROLE: ${{ steps.role.outputs.role }}
          BASE_REF: origin/${{ github.base_ref }}

  file-check:
    name: file-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx cms-check-files
        env:
          BASE_REF: origin/${{ github.base_ref }}
