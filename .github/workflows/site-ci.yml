name: Site CI

on:
  workflow_call:
    inputs:
      path-guard:
        type: boolean
        default: true
    secrets:
      team-read-token:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:admin
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: base
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        id: base-build
        continue-on-error: true
        working-directory: base
        run: |
          npm ci
          npm run build
      - if: github.event_name == 'pull_request' && steps.base-build.outcome == 'success'
        continue-on-error: true
        run: npx cms-dist-diff base/dist dist dist-diff
      - if: github.event_name == 'pull_request' && steps.base-build.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-diff
          path: |
            dist-diff/report.md
            dist-diff/dist.patch
          if-no-files-found: ignore

  path-guard:
    name: path-guard
    if: inputs.path-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: role
        env:
          GH_TOKEN: ${{ secrets.team-read-token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          role=operator
          for team in site-poweruser site-admins; do
            if gh api "orgs/${GITHUB_REPOSITORY_OWNER}/teams/${team}/memberships/${AUTHOR}" --silent 2>/dev/null; then
              role=privileged
            fi
          done
          echo "role=${role}" >> "$GITHUB_OUTPUT"
      - run: npx cms-path-guard
        env:
          AUTHOR_ROLE: ${{ steps.role.outputs.role }}
          BASE_REF: origin/${{ github.base_ref }}

  file-check:
    name: file-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx cms-check-files
        env:
          BASE_REF: origin/${{ github.base_ref }}
