name: Site CI

on:
  workflow_call:
    inputs:
      path-guard:
        type: boolean
        default: true
    secrets:
      team-read-token:
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SHOW_UNPUBLISHED: ${{ github.event_name == 'pull_request' && '1' || '' }}
      - run: npm run build:admin
      - if: github.event_name == 'pull_request'
        id: release
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          sha_of() { sed -n 's/^PUBLISH_SHA=//p' | head -n1; }
          old=""
          new=""
          if git fetch --no-tags --depth=1 origin "$BASE_REF"; then
            old=$(git show FETCH_HEAD:config/production.env 2>/dev/null | sha_of || true)
          fi
          if [ -f config/production.env ]; then new=$(sha_of < config/production.env || true); fi
          old_ref="${old:-$BASE_REF}"
          new_ref="${new:-$BASE_REF}"
          release=false
          if [ "$old_ref" != "$new_ref" ]; then
            ok=true
            for r in "$old" "$new"; do
              if [ -n "$r" ] && ! [[ "$r" =~ ^[0-9a-f]{40}$ ]]; then ok=false; fi
            done
            if [ -n "$new" ] && ! git fetch --no-tags --depth=1 origin "$new"; then ok=false; fi
            if [ -n "$old" ] && ! git fetch --no-tags --depth=1 origin "$old"; then ok=false; fi
            release=$ok
          fi
          label() { if [ -n "$1" ]; then echo "${1:0:7}"; else echo "${BASE_REF}のHEAD"; fi; }
          {
            echo "release=${release}"
            echo "old_ref=${old_ref}"
            echo "new_ref=${new_ref}"
            echo "title=本番の現在（$(label "$old")）とこのPRで出すコミット（$(label "$new")）の比較"
          } >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.release == 'true' && steps.release.outputs.old_ref || github.base_ref }}
          path: base
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        id: base-build
        continue-on-error: true
        working-directory: base
        env:
          SHOW_UNPUBLISHED: "1"
        run: |
          npm ci
          npm run build
      - if: github.event_name == 'pull_request' && steps.release.outputs.release == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.new_ref }}
          path: release
          persist-credentials: false
      - if: github.event_name == 'pull_request' && steps.release.outputs.release == 'true'
        id: release-build
        continue-on-error: true
        working-directory: release
        env:
          SHOW_UNPUBLISHED: "1"
        run: |
          npm ci
          npm run build
      - if: github.event_name == 'pull_request' && steps.base-build.outcome == 'success' && steps.release-build.outcome != 'failure'
        continue-on-error: true
        env:
          RELEASE: ${{ steps.release.outputs.release }}
          DIST_DIFF_TITLE: ${{ steps.release.outputs.release == 'true' && steps.release.outputs.title || '' }}
          DIST_DIFF_NOTE: 公開日時にかかわらず、全件を出力した状態で比較しています。
        run: |
          head=dist
          if [ "$RELEASE" = true ]; then head=release/dist; fi
          npx cms-dist-diff base/dist "$head" dist-diff
      - if: github.event_name == 'pull_request' && steps.base-build.outcome == 'success' && steps.release-build.outcome != 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-diff
          path: |
            dist-diff/report.md
            dist-diff/dist.patch
          if-no-files-found: ignore
      - if: github.event_name == 'pull_request' && steps.base-build.outcome == 'success' && steps.release-build.outcome != 'failure'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = 'dist-diff/report.md';
            if (!fs.existsSync(path)) return;
            const marker = '<!-- dist-diff -->';
            let report = fs.readFileSync(path, 'utf8');
            if (report.length > 60000) report = report.slice(0, 60000) + '\n... (truncated)';
            const body = [marker, report, '', `*全差分は artifact \`dist-diff\`（run: ${context.runId}）*`].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  path-guard:
    name: path-guard
    if: inputs.path-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: role
        env:
          GH_TOKEN: ${{ secrets.team-read-token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          role=operator
          for team in site-poweruser site-admins; do
            if gh api "orgs/${GITHUB_REPOSITORY_OWNER}/teams/${team}/memberships/${AUTHOR}" --silent 2>/dev/null; then
              role=privileged
            fi
          done
          echo "role=${role}" >> "$GITHUB_OUTPUT"
      - run: npx cms-path-guard
        env:
          AUTHOR_ROLE: ${{ steps.role.outputs.role }}
          BASE_REF: origin/${{ github.base_ref }}

  file-check:
    name: file-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx cms-check-files
        env:
          BASE_REF: origin/${{ github.base_ref }}
