name: Site deploy

on:
  workflow_call:
    inputs:
      config-file:
        description: "配信先の情報を書いたenvファイル（KEY=value）。キーの一覧はREADMEの「配信基盤の契約」を参照"
        type: string
        default: config/deploy.env
      target:
        description: "staging または production。指定すると、envファイルの <TARGET>_* の値を使い、Environment名もこの値になる"
        type: string
        default: ""
      deploy-admin:
        description: "trueにすると、管理画面を <CMS_PREFIX>/admin/ へ配信する（envファイルの CMS_* を使う）"
        type: boolean
        default: false
      ref:
        description: "ビルドするコミット。空なら呼び出し元のコミット"
        type: string
        default: ""
      ref-from-environment:
        description: "refが空のとき、このEnvironment（例: staging）に最後に成功したデプロイのコミットをビルドする"
        type: string
        default: ""
      environment:
        description: "envファイルより優先するEnvironment名"
        type: string
        default: ""
      site-url:
        description: "envファイルより優先するSITE_URL"
        type: string
        default: ""
      aws-role-arn:
        description: "envファイルより優先するデプロイ用ロール。空でenvファイルにもなければサイトの配信はしない"
        type: string
        default: ""
      aws-region:
        type: string
        default: ""
      s3-bucket:
        type: string
        default: ""
      s3-prefix:
        type: string
        default: ""
      cloudfront-distribution-id:
        type: string
        default: ""
      admin-s3-bucket:
        type: string
        default: ""
      admin-s3-prefix:
        type: string
        default: ""
      admin-site-url:
        description: "管理画面のビルドに渡すSITE_URL。空なら https://<CMS_DOMAIN>、それもなければsite-url"
        type: string
        default: ""
      admin-role-arn:
        type: string
        default: ""
      admin-rsync-target:
        type: string
        default: ""
      admin-runner-labels:
        type: string
        default: '["self-hosted"]'

permissions:
  id-token: write
  contents: read
  deployments: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.c.outputs.environment }}
      site_url: ${{ steps.c.outputs.site_url }}
      role_arn: ${{ steps.c.outputs.role_arn }}
      region: ${{ steps.c.outputs.region }}
      bucket: ${{ steps.c.outputs.bucket }}
      prefix: ${{ steps.c.outputs.prefix }}
      distribution_id: ${{ steps.c.outputs.distribution_id }}
      admin_bucket: ${{ steps.c.outputs.admin_bucket }}
      admin_prefix: ${{ steps.c.outputs.admin_prefix }}
      admin_role_arn: ${{ steps.c.outputs.admin_role_arn }}
      admin_site_url: ${{ steps.c.outputs.admin_site_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: c
        env:
          CONFIG_FILE: ${{ inputs.config-file }}
          TARGET: ${{ inputs.target }}
          DEPLOY_ADMIN: ${{ inputs.deploy-admin }}
          IN_ENVIRONMENT: ${{ inputs.environment }}
          IN_SITE_URL: ${{ inputs.site-url }}
          IN_ROLE_ARN: ${{ inputs.aws-role-arn }}
          IN_REGION: ${{ inputs.aws-region }}
          IN_BUCKET: ${{ inputs.s3-bucket }}
          IN_PREFIX: ${{ inputs.s3-prefix }}
          IN_DISTRIBUTION_ID: ${{ inputs.cloudfront-distribution-id }}
          IN_ADMIN_BUCKET: ${{ inputs.admin-s3-bucket }}
          IN_ADMIN_PREFIX: ${{ inputs.admin-s3-prefix }}
          IN_ADMIN_SITE_URL: ${{ inputs.admin-site-url }}
          IN_ADMIN_ROLE_ARN: ${{ inputs.admin-role-arn }}
        run: |
          json='{}'
          if [ -f "$CONFIG_FILE" ]; then
            json=$(jq -Rn '[inputs | select(test("^[A-Z0-9_]+=")) | capture("^(?<k>[A-Z0-9_]+)=(?<v>.*)$") | {key: .k, value: .v}] | from_entries' "$CONFIG_FILE")
          fi
          get() { jq -r --arg k "$1" '.[$k] // empty' <<<"$json"; }
          upper=$(printf '%s' "$TARGET" | tr '[:lower:]' '[:upper:]')
          tget() { if [ -n "$upper" ]; then get "${upper}_$1"; fi; }

          environment="${IN_ENVIRONMENT:-$TARGET}"
          site_url="${IN_SITE_URL:-$(tget SITE_URL)}"
          role_arn="${IN_ROLE_ARN:-$(tget DEPLOY_ROLE_ARN)}"
          region="${IN_REGION:-$(get AWS_REGION)}"
          region="${region:-ap-northeast-1}"
          bucket="${IN_BUCKET:-$(get S3_BUCKET)}"
          prefix="${IN_PREFIX:-$(tget PREFIX)}"
          prefix="${prefix:-$TARGET}"
          distribution_id="${IN_DISTRIBUTION_ID:-$(tget CLOUDFRONT_DISTRIBUTION_ID)}"

          admin_bucket=""
          admin_role_arn="${IN_ADMIN_ROLE_ARN:-$(get CMS_ADMIN_DEPLOY_ROLE_ARN)}"
          if [ "$DEPLOY_ADMIN" = true ] || [ -n "$IN_ADMIN_BUCKET" ]; then
            admin_bucket="${IN_ADMIN_BUCKET:-$bucket}"
            if [ -z "$admin_role_arn" ]; then admin_bucket=""; fi
          fi
          admin_prefix="${IN_ADMIN_PREFIX:-$(get CMS_PREFIX)}"
          admin_prefix="${admin_prefix:-cms}"
          cms_domain=$(get CMS_DOMAIN)
          admin_site_url="${IN_ADMIN_SITE_URL:-${cms_domain:+https://$cms_domain}}"
          admin_site_url="${admin_site_url:-$site_url}"

          {
            echo "environment=$environment"
            echo "site_url=$site_url"
            echo "role_arn=$role_arn"
            echo "region=$region"
            echo "bucket=$bucket"
            echo "prefix=$prefix"
            echo "distribution_id=$distribution_id"
            echo "admin_bucket=$admin_bucket"
            echo "admin_prefix=$admin_prefix"
            echo "admin_role_arn=$admin_role_arn"
            echo "admin_site_url=$admin_site_url"
          } >> "$GITHUB_OUTPUT"

  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          FROM_ENVIRONMENT: ${{ inputs.ref-from-environment }}
        run: |
          ref="$REF"
          if [ -z "$ref" ] && [ -n "$FROM_ENVIRONMENT" ]; then
            for id in $(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=${FROM_ENVIRONMENT}&per_page=10" --jq '.[].id'); do
              state=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" --jq '.[0].state')
              if [ "$state" = success ]; then
                ref=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}" --jq .sha)
                break
              fi
            done
            if [ -z "$ref" ]; then
              echo "${FROM_ENVIRONMENT} に成功したデプロイがありません" >&2
              exit 1
            fi
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "ビルドするコミット: ${ref:-$GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [config, resolve]
    if: needs.config.outputs.role_arn != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ needs.config.outputs.site_url }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist

  deploy-aws:
    needs: [config, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.environment }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ needs.config.outputs.role_arn }}
          aws-region: ${{ needs.config.outputs.region }}
      - env:
          BUCKET: ${{ needs.config.outputs.bucket }}
          PREFIX: ${{ needs.config.outputs.prefix }}
          DISTRIBUTION_ID: ${{ needs.config.outputs.distribution_id }}
        run: |
          aws s3 sync dist "s3://${BUCKET}/${PREFIX}/" --delete
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

  deploy-admin:
    needs: config
    if: inputs.admin-rsync-target != ''
    runs-on: ${{ fromJSON(inputs.admin-runner-labels) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:admin
        env:
          SITE_URL: ${{ needs.config.outputs.admin_site_url }}
      - run: rsync -a --delete dist-admin/ "${{ inputs.admin-rsync-target }}"

  deploy-admin-s3:
    needs: config
    if: needs.config.outputs.admin_bucket != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:admin
        env:
          SITE_URL: ${{ needs.config.outputs.admin_site_url }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ needs.config.outputs.admin_role_arn }}
          aws-region: ${{ needs.config.outputs.region }}
      - env:
          BUCKET: ${{ needs.config.outputs.admin_bucket }}
          PREFIX: ${{ needs.config.outputs.admin_prefix }}
        run: |
          aws s3 sync dist-admin "s3://${BUCKET}/${PREFIX}/admin/" --delete
          aws s3 cp dist-admin/config.yml "s3://${BUCKET}/${PREFIX}/admin/config.yml" --content-type "text/yaml; charset=utf-8"
