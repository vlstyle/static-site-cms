name: Site deploy

on:
  workflow_call:
    inputs:
      environment:
        description: "デプロイ先の環境名。config/<environment>.env を読む。cms は管理画面とPRのプレビュー、production は本番、それ以外（staging など）は通常の環境として扱う。英小文字・数字・ハイフンのみ"
        type: string
        required: true
      show-unpublished:
        description: "true/false。公開日時が未来のページも出力するか。指定すると、envファイルの SHOW_UNPUBLISHED より優先する。どちらもなければfalse（cms のプレビューは常に出力する）"
        type: string
        default: ""

permissions:
  id-token: write
  contents: read
  deployments: read
  pull-requests: write

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.c.outputs.mode }}
      ref: ${{ steps.c.outputs.ref }}
      site_url: ${{ steps.c.outputs.site_url }}
      role_arn: ${{ steps.c.outputs.role_arn }}
      region: ${{ steps.c.outputs.region }}
      bucket: ${{ steps.c.outputs.bucket }}
      prefix: ${{ steps.c.outputs.prefix }}
      distribution_id: ${{ steps.c.outputs.distribution_id }}
      show_unpublished: ${{ steps.c.outputs.show_unpublished }}
      release_sha: ${{ steps.c.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: c
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SHOW_UNPUBLISHED_INPUT: ${{ inputs.show-unpublished }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          fail() { echo "$1" >&2; exit 1; }

          [[ "$ENVIRONMENT" =~ ^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$ ]] || fail "environment は英小文字・数字・ハイフンのみ（先頭と末尾は英数字）: ${ENVIRONMENT}"
          [[ "$SHOW_UNPUBLISHED_INPUT" =~ ^(true|false)?$ ]] || fail "show-unpublished は true か false で指定してください: ${SHOW_UNPUBLISHED_INPUT}"

          file="config/${ENVIRONMENT}.env"
          [ -f "$file" ] || fail "${file} がありません"
          json=$(jq -Rn '[inputs | select(test("^[A-Z0-9_]+=")) | capture("^(?<k>[A-Z0-9_]+)=(?<v>.*)$") | {key: .k, value: .v}] | from_entries' "$file")
          get() { jq -r --arg k "$1" '.[$k] // empty' <<<"$json"; }
          require_default_branch() {
            [ "$GITHUB_REF" = "refs/heads/${DEFAULT_BRANCH}" ] || fail "${ENVIRONMENT} はデフォルトブランチ（${DEFAULT_BRANCH}）から実行してください。実行元: ${GITHUB_REF}"
          }

          ref="$GITHUB_SHA"
          release_sha=""
          role_key=DEPLOY_ROLE_ARN
          if [ "$ENVIRONMENT" = cms ]; then
            prefix_default=cms
            if [ "$EVENT_NAME" = pull_request ]; then
              role_key=PREVIEW_ROLE_ARN
              ref=""
              if [ "$EVENT_ACTION" = closed ]; then
                mode=cleanup
              else
                mode=preview
                sha_of() { sed -n 's/^PUBLISH_SHA=//p' | head -n1; }
                old=$(git show "origin/${BASE_REF}:config/production.env" 2>/dev/null | sha_of || true)
                new=""
                if [ -f config/production.env ]; then new=$(sha_of < config/production.env || true); fi
                if [ "${old:-$BASE_REF}" != "${new:-$BASE_REF}" ]; then
                  target="${new:-$(git rev-parse "origin/${BASE_REF}")}"
                  if [[ "$target" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$target" "origin/${BASE_REF}" 2>/dev/null; then
                    release_sha="$target"
                    ref="$target"
                  fi
                fi
              fi
            else
              require_default_branch
              mode=admin
            fi
          else
            prefix_default="$ENVIRONMENT"
            mode=site
            [ "$EVENT_NAME" != pull_request ] || fail "${ENVIRONMENT} はpull_requestでは実行できません"
            if [ "$ENVIRONMENT" = production ]; then
              require_default_branch
              publish_sha=$(get PUBLISH_SHA)
              if [ -n "$publish_sha" ]; then
                [[ "$publish_sha" =~ ^[0-9a-f]{40}$ ]] || fail "PUBLISH_SHA は40桁の小文字のコミットハッシュで指定してください: ${publish_sha}"
                git cat-file -e "${publish_sha}^{commit}" 2>/dev/null || fail "PUBLISH_SHA のコミットがありません: ${publish_sha}"
                git merge-base --is-ancestor "$publish_sha" "origin/${DEFAULT_BRANCH}" || fail "PUBLISH_SHA がデフォルトブランチに含まれていません: ${publish_sha}"
                ref="$publish_sha"
              fi
            fi
          fi

          role_arn=$(get "$role_key")
          bucket=$(get S3_BUCKET)
          [ -n "$role_arn" ] || fail "${file} に ${role_key} がありません"
          [ -n "$bucket" ] || fail "${file} に S3_BUCKET がありません"

          show_unpublished="${SHOW_UNPUBLISHED_INPUT:-$(get SHOW_UNPUBLISHED)}"
          [[ "$show_unpublished" =~ ^(true|false)?$ ]] || fail "${file} の SHOW_UNPUBLISHED は true か false で指定してください: ${show_unpublished}"

          prefix=$(get PREFIX)
          region=$(get AWS_REGION)
          site_url=$(get SITE_URL)
          cms_domain=$(get CMS_DOMAIN)
          if [ "$ENVIRONMENT" = cms ]; then
            [ -n "$cms_domain" ] || fail "${file} に CMS_DOMAIN がありません"
            site_url="https://${cms_domain}"
          fi

          {
            echo "mode=${mode}"
            echo "ref=${ref}"
            echo "site_url=${site_url}"
            echo "role_arn=${role_arn}"
            echo "region=${region:-ap-northeast-1}"
            echo "bucket=${bucket}"
            echo "prefix=${prefix:-$prefix_default}"
            echo "distribution_id=$(get CLOUDFRONT_DISTRIBUTION_ID)"
            echo "show_unpublished=${show_unpublished:-false}"
            echo "release_sha=${release_sha}"
          } >> "$GITHUB_OUTPUT"
          echo "環境: ${ENVIRONMENT} / 動作: ${mode} / コミット: ${ref:-（PRのマージコミット）}" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: config
    if: needs.config.outputs.mode != 'cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.config.outputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        env:
          MODE: ${{ needs.config.outputs.mode }}
          SITE_URL: ${{ needs.config.outputs.site_url }}
          SHOW_UNPUBLISHED: ${{ needs.config.outputs.show_unpublished == 'true' && '1' || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "$MODE" in
            admin)
              npm run build:admin
              out=dist-admin
              ;;
            preview)
              PREVIEW=1 BASE_PATH="/preview/pr-${PR_NUMBER}" npm run build
              out=dist
              ;;
            *)
              npm run build
              out=dist
              ;;
          esac
          mv "$out" "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: ${{ runner.temp }}/out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tools
          path: node_modules/static-site-cms/scripts/s3-sync.sh

  deploy-site:
    needs: [config, build]
    if: needs.config.outputs.mode == 'site'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ needs.config.outputs.site_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tools
          path: tools
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ needs.config.outputs.role_arn }}
          aws-region: ${{ needs.config.outputs.region }}
      - env:
          BUCKET: ${{ needs.config.outputs.bucket }}
          PREFIX: ${{ needs.config.outputs.prefix }}
          DISTRIBUTION_ID: ${{ needs.config.outputs.distribution_id }}
        run: |
          ASSETS_DIR=_astro
          if [ -d "dist/${ASSETS_DIR}" ]; then
            aws s3 sync "dist/${ASSETS_DIR}" "s3://${BUCKET}/${PREFIX}/${ASSETS_DIR}/" --size-only --cache-control "public, max-age=31536000, immutable"
          fi
          SYNC_EXCLUDE="$ASSETS_DIR" bash tools/s3-sync.sh dist "$PREFIX" "no-cache"
          if [ -n "$DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" >/dev/null
          fi

  deploy-admin:
    needs: [config, build]
    if: needs.config.outputs.mode == 'admin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: dist-admin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tools
          path: tools
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ needs.config.outputs.role_arn }}
          aws-region: ${{ needs.config.outputs.region }}
      - env:
          BUCKET: ${{ needs.config.outputs.bucket }}
          PREFIX: ${{ needs.config.outputs.prefix }}
          DISTRIBUTION_ID: ${{ needs.config.outputs.distribution_id }}
        run: |
          bash tools/s3-sync.sh dist-admin "${PREFIX}/admin" "no-cache"
          if [ -n "$DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/admin/*" >/dev/null
          fi

  deploy-preview:
    needs: [config, build]
    if: needs.config.outputs.mode == 'preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tools
          path: tools
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ needs.config.outputs.role_arn }}
          aws-region: ${{ needs.config.outputs.region }}
      - env:
          BUCKET: ${{ needs.config.outputs.bucket }}
          PREFIX: ${{ needs.config.outputs.prefix }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash tools/s3-sync.sh dist "${PREFIX}/preview/pr-${PR_NUMBER}" "no-cache"
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          URL: ${{ needs.config.outputs.site_url }}/preview/pr-${{ github.event.pull_request.number }}/
          SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_SHA: ${{ needs.config.outputs.release_sha }}
        with:
          script: |
            const marker = '<!-- site-preview -->';
            const release = process.env.RELEASE_SHA
              ? `\n\nこのPRは本番に出すコミットを変更するため、プレビューは本番に出すコミット \`${process.env.RELEASE_SHA.slice(0, 7)}\` のビルド結果（公開日時にかかわらず全件を出力）です。`
              : '';
            const body = `${marker}\nプレビュー: ${process.env.URL} （最新コミット: ${process.env.SHA.slice(0, 7)}、閲覧にはBasic認証が必要です）${release}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup-preview:
    needs: config
    if: needs.config.outputs.mode == 'cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ needs.config.outputs.role_arn }}
          aws-region: ${{ needs.config.outputs.region }}
      - env:
          BUCKET: ${{ needs.config.outputs.bucket }}
          PREFIX: ${{ needs.config.outputs.prefix }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: aws s3 rm "s3://${BUCKET}/${PREFIX}/preview/pr-${PR_NUMBER}/" --recursive
