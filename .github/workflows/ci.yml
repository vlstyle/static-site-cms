name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm run build:admin
      - name: Validate admin config against the Sveltia schema
        working-directory: .
        run: |
          pip install --quiet jsonschema pyyaml
          python3 - <<'PY'
          import json, yaml, jsonschema, sys
          schema = json.load(open('examples/site/node_modules/@sveltia/cms/schema/sveltia-cms.json'))
          cfg = yaml.safe_load(open('examples/site/dist-admin/config.yml'))
          errors = list(jsonschema.Draft7Validator(schema).iter_errors(cfg))
          for e in errors:
              print(list(e.path), e.message[:200])
          sys.exit(1 if errors else 0)
          PY
