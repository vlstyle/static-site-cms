name: Terraform apply

on:
  workflow_call:
    inputs:
      config-file:
        description: 配信先の情報を書いたenvファイル（KEY=value）。role-arn・state-bucketが空のとき、TERRAFORM_APPLY_ROLE_ARN と TERRAFORM_STATE_BUCKET を読む
        type: string
        default: config/deploy.env
      role-arn:
        description: apply用のIAMロールのARN。envファイルより優先する
        type: string
        default: ""
      state-bucket:
        description: Terraform stateを置くS3バケット名。envファイルより優先する
        type: string
        default: ""
      state-key:
        type: string
        default: terraform/stack.tfstate
      aws-region:
        type: string
        default: ap-northeast-1
      tfvars-file:
        description: 呼び出し側リポジトリ内のtfvarsファイル
        type: string
        default: terraform/terraform.tfvars
      terraform-version:
        type: string
        default: "1.16.4"
      env-file:
        description: applyの出力 github_variables を書き出すenvファイル。指定すると、変更があるとき更新のPRを作る（呼び出し元のジョブに contents の write と pull-requests の write が必要）。空なら何もしない
        type: string
        default: ""
    secrets:
      basic-auth-password:
        description: CMSとstagingのBasic認証のパスワード（TF_VAR_basic_auth_passwordとして渡す）。Basic認証が有効なとき必須
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      STACK_DIR: node_modules/static-site-cms/terraform/stacks/aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: config
        env:
          CONFIG_FILE: ${{ inputs.config-file }}
          IN_ROLE_ARN: ${{ inputs.role-arn }}
          IN_STATE_BUCKET: ${{ inputs.state-bucket }}
        run: |
          json='{}'
          if [ -f "$CONFIG_FILE" ]; then
            json=$(jq -Rn '[inputs | select(test("^[A-Z0-9_]+=")) | capture("^(?<k>[A-Z0-9_]+)=(?<v>.*)$") | {key: .k, value: .v}] | from_entries' "$CONFIG_FILE")
          fi
          get() { jq -r --arg k "$1" '.[$k] // empty' <<<"$json"; }
          role="${IN_ROLE_ARN:-$(get TERRAFORM_APPLY_ROLE_ARN)}"
          bucket="${IN_STATE_BUCKET:-$(get TERRAFORM_STATE_BUCKET)}"
          if [ -z "$role" ] || [ -z "$bucket" ]; then
            echo "role-arn と state-bucket を入力するか、${CONFIG_FILE} に TERRAFORM_APPLY_ROLE_ARN と TERRAFORM_STATE_BUCKET を書いてください" >&2
            exit 1
          fi
          echo "role_arn=$role" >> "$GITHUB_OUTPUT"
          echo "state_bucket=$bucket" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ inputs.aws-region }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - name: Pass the Basic auth password
        env:
          BASIC_AUTH_PASSWORD: ${{ secrets.basic-auth-password }}
        run: |
          if [ -n "$BASIC_AUTH_PASSWORD" ]; then
            {
              echo "TF_VAR_basic_auth_password<<__CMS_PW__"
              printf '%s\n' "$BASIC_AUTH_PASSWORD"
              echo "__CMS_PW__"
            } >> "$GITHUB_ENV"
          fi
      - name: Terraform init
        run: |
          terraform -chdir="$STACK_DIR" init -input=false \
            -backend-config="bucket=${{ steps.config.outputs.state_bucket }}" \
            -backend-config="key=${{ inputs.state-key }}" \
            -backend-config="region=${{ inputs.aws-region }}" \
            -backend-config="use_lockfile=true"
      - name: Terraform apply
        run: |
          terraform -chdir="$STACK_DIR" apply -input=false -auto-approve -no-color -lock-timeout=5m \
            -var-file="$GITHUB_WORKSPACE/${{ inputs.tfvars-file }}"
      - name: Show outputs
        run: terraform -chdir="$STACK_DIR" output -no-color github_variables
      - name: Save outputs
        if: inputs.env-file != ''
        run: terraform -chdir="$STACK_DIR" output -json github_variables > "$RUNNER_TEMP/github_variables.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.env-file != ''
        with:
          name: github-variables
          path: ${{ runner.temp }}/github_variables.json

  update-env:
    needs: apply
    if: inputs.env-file != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-variables
          path: ${{ runner.temp }}
      - name: Update the env file
        env:
          ENV_FILE: ${{ inputs.env-file }}
        run: |
          python3 - "$ENV_FILE" "$RUNNER_TEMP/github_variables.json" <<'PY'
          import json, os, re, sys
          path, outputs = sys.argv[1], sys.argv[2]
          current = {}
          if os.path.exists(path):
              for line in open(path):
                  m = re.match(r'^([A-Z0-9_]+)=(.*)$', line.rstrip('\n'))
                  if m:
                      current[m.group(1)] = m.group(2)
          current.update({k: v for k, v in json.load(open(outputs)).items() if v is not None})
          os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
          with open(path, 'w') as f:
              f.write('# terraform-apply.yml が出力 github_variables から更新する。同じキーは上書きされ、ほかのキーは保持される。\n')
              for k in sorted(current):
                  f.write(f'{k}={current[k]}\n')
          PY
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ENV_FILE: ${{ inputs.env-file }}
          BASE: ${{ github.event.repository.default_branch }}
          BRANCH: terraform/update-deploy-env
        run: |
          if [ -z "$(git status --porcelain -- "$ENV_FILE")" ]; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -- "$ENV_FILE"
          git commit -m "Terraformのoutputに合わせて${ENV_FILE}を更新する"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "Terraformのoutputに合わせて${ENV_FILE}を更新する" \
              --body "terraform-apply.ymlが、applyの出力 github_variables から ${ENV_FILE} を更新した。マージするとデプロイ用workflowが新しい値を使う。"
          fi
